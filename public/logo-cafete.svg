<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="CAFÉTÉ">
  <defs>
    <radialGradient id="burst" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#F6C443"/>
      <stop offset="45%" stop-color="#F59A3C"/>
      <stop offset="100%" stop-color="#E5391C"/>
    </radialGradient>
  </defs>
  <g transform="translate(320 100)">
    <g fill="#E5391C" opacity="0.9">
      <!-- 12 sunburst rays -->
      <g>
        <rect x="-7" y="-104" width="14" height="34" rx="7"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(30)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(60)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(90)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(120)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(150)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(180)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(210)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(240)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(270)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(300)"/>
        <rect x="-7" y="-104" width="14" height="34" rx="7" transform="rotate(330)"/>
      </g>
